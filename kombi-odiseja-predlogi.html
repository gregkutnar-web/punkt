<!doctype html>
<html lang="sl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Odiseja – predlogi poslikave kombija</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sans:"Helvetica Neue","Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);--teal:#0097a7;--ink:#0b1416}
html{background:var(--ink)}
body{font-family:var(--sans);color:#eef6f7;background:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;background:radial-gradient(120% 80% at 50% 110%,#0a3a40 0,var(--ink) 60%);position:relative}
.hero h1{font-weight:800;letter-spacing:-.03em;line-height:.9;font-size:clamp(56px,15vw,230px);text-transform:uppercase}
.hero h1 span{display:block;font-size:.32em;letter-spacing:.38em;font-weight:600;color:#4fd0db;margin-bottom:.35em}
.hero p{margin-top:36px;font-size:clamp(14px,1.4vw,18px);color:#9db7ba;letter-spacing:.04em}
section.s{min-height:100vh;min-height:100svh;padding:7vh 4vw 14vh;display:flex;flex-direction:column;justify-content:center;gap:22px}
.t{display:flex;align-items:baseline;gap:16px;max-width:1500px;width:100%;margin:0 auto}
.t b{font-size:clamp(26px,3.4vw,48px);letter-spacing:-.02em}
.stage{position:relative;width:100%;max-width:1500px;margin:0 auto;aspect-ratio:2/1;max-height:76vh;border-radius:26px;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,151,167,.45),0 10px 30px rgba(0,0,0,.5);background:#111;opacity:0;transform:translateY(40px) scale(.98);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.stage.in{opacity:1;transform:none}
.box{position:absolute;inset:0;transition:transform 1.3s var(--ease);transform-origin:var(--ox) var(--oy)}
.stage.z .box{transform:scale(var(--zs))}
.box img,.box svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov .a{transform-box:fill-box;transform-origin:center}
.play .ov .a{animation:pop .9s var(--ease) both;animation-delay:calc(var(--i)*70ms + .2s)}
.ov:not(.play *) .a{}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.bar{position:absolute;right:16px;bottom:16px;display:flex;gap:8px}
.bar button{padding:11px 18px;border-radius:99px;font-size:14px;background:rgba(255,255,255,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.3);color:#fff;transition:background .3s}
.bar button:hover{background:rgba(255,255,255,.3)}
.acc{display:flex;gap:10px;max-width:1500px;width:100%;margin:0 auto;height:min(64vh,620px)}
.acc>div{position:relative;flex:1;border-radius:22px;overflow:hidden;cursor:pointer;transition:flex 1s var(--ease);box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.acc>div.on{flex:6}
.acc .in2{position:absolute;top:0;height:100%;aspect-ratio:2/1;left:50%;transform:translateX(-50%)}
.acc .in2 img,.acc .in2 svg{position:absolute;inset:0;width:100%;height:100%}
.acc em{position:absolute;left:14px;top:14px;padding:7px 14px;border-radius:99px;font-size:13px;font-style:normal;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
nav{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:99px;background:rgba(20,32,34,.55);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 40px rgba(0,0,0,.4);z-index:9}
nav a{padding:10px 18px;border-radius:99px;font-size:14px;color:#c4d8da;text-decoration:none;transition:background .4s var(--ease),color .3s;white-space:nowrap}
nav a.on{background:var(--teal);color:#fff}
nav .m{display:none}
@media(max-width:700px){section.s{padding:5vh 14px 14vh}.stage{border-radius:18px}nav .d{display:none}nav .m{display:inline}nav a{padding:10px 14px}.bar{right:8px;bottom:8px;gap:6px}.bar button{padding:6px 11px;font-size:11px}
.acc{flex-direction:column;height:min(62vh,400px)}.acc .in2{height:auto;width:100%;top:50%;left:0;transform:translateY(-50%)}.acc>div.on{flex:3}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}.stage{opacity:1;transform:none}.play .ov .a{animation:none}}
</style></head><body>
<header class="hero" id="hero"><h1>Odiseja</h1><p>Poslikava kombija</p></header>
