:root{--ink:#0a0a0a;--teal:#00868f;--line:rgba(10,10,10,.14);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:#fff;color:var(--ink);font:400 16px/1.6 Inter,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bar{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;justify-content:space-between;padding:20px clamp(20px,4vw,56px);font:600 12px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;mix-blend-mode:difference;color:#fff}
.bar a{color:inherit;text-decoration:none;margin-left:28px}
.hero{min-height:100svh;padding:120px clamp(20px,4vw,56px) 40px;display:grid;grid-template-columns:1fr;align-content:space-between;position:relative}
.aa{font:800 clamp(120px,46vw,760px)/.78 Unbounded,sans-serif;letter-spacing:-.05em;color:var(--teal);margin-left:-.04em;user-select:none}
.hero .row{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;border-top:1px solid var(--ink);padding-top:20px;margin-top:40px}
.hero h1{font:800 clamp(34px,5vw,72px)/1.02 Unbounded,sans-serif;letter-spacing:-.03em}
.hero p{max-width:44ch;color:#444;justify-self:end}
section{display:grid;grid-template-columns:minmax(120px,18vw) 1fr;gap:clamp(16px,3vw,48px);padding:96px clamp(20px,4vw,56px);border-top:1px solid var(--ink)}
.k{position:sticky;top:80px;align-self:start}
.k b{display:block;font:800 clamp(40px,6vw,96px)/1 Unbounded,sans-serif;letter-spacing:-.04em;color:var(--teal)}
.k span{display:block;margin-top:12px;font:600 12px/1.4 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase}
figure{outline:1px solid var(--line);outline-offset:0;opacity:0;transform:translateY(32px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
figure.in{opacity:1;transform:none}
figure img{display:block;width:100%;height:auto}
.cap{display:flex;justify-content:space-between;margin-top:14px;font:500 12px/1.4 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#555}
footer{border-top:1px solid var(--ink);padding:28px clamp(20px,4vw,56px);display:flex;justify-content:space-between;font:500 12px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase}
@media(max-width:760px){.hero .row{grid-template-columns:1fr}.hero p{justify-self:start}section{grid-template-columns:1fr;padding:56px 20px}.k{position:static;display:flex;align-items:baseline;gap:16px}.k span{margin:0}.bar a{margin-left:16px}}
@media(prefers-reduced-motion:reduce){figure{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
