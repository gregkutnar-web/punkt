<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pravi Punkt – izbrani logotip</title>
<meta name="description" content="Izbrani logotip Pravi Punkt, Skupina Boscarol.">
<style>__STYLE__</style>
</head>
<body>

<nav id="nav" aria-label="Navigacija">
  <span class="pill"></span>
  <a href="#ideja"><span class="l">Ideja</span><span class="s">Ideja</span></a>
  <a href="#logotip"><span class="l">Logotip</span><span class="s">Logotip</span></a>
  <a href="#ikona"><span class="l">Ikona</span><span class="s">Ikona</span></a>
  <a href="#razlicice"><span class="l">Različice</span><span class="s">Različice</span></a>
</nav>

<main>
<!-- hero: nevtralen, brez ikone in logotipa -->
<section id="hero">
  <div class="by">Skupina Boscarol</div>
  <h1 aria-label="Pravi Punkt"><span class="w1">Pravi</span><span class="w2">Punkt</span></h1>
  <p>Izbrani logotip</p>
  <div class="bg"><div class="cue"></div></div>
</section>

<!-- ideja: animacija ikone -->
<section id="ideja" class="osn tp1">
  <div class="scrub" style="--n:8">
    <div class="sticky">
      <div class="tag"><b>Ideja</b></div>
      <div class="stagewrap">
        <svg class="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="1600" height="900" fill="#fff"/><g class="cam">__IDEA__</g></svg>
        <div class="cap"><span></span></div>
      </div>
      <div class="chips"></div>
      <div class="ctl"><button class="play">Predvajaj</button><div class="bar"><i></i></div></div>
    </div>
  </div>
</section>

<!-- logotip: oblike -->
<section id="logotip" class="osn tp2">
  <div class="scrub" style="--n:6">
    <div class="sticky">
      <div class="tag"><b>Logotip</b></div>
      <div class="stagewrap">
        <svg class="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="1600" height="900" fill="#fff"/><g class="cam">__LOGO__</g></svg>
        <div class="cap"><span></span></div>
      </div>
      <div class="chips"></div>
      <div class="ctl"><button class="play">Predvajaj</button><div class="bar"><i></i></div></div>
    </div>
  </div>
</section>

<!-- ikona -->
<section id="ikona" class="osn tp3">
  <div class="isec">
    <div class="tag"><b>Ikona</b></div>
    <div class="icons" id="icons" style="--sz:260px">
      <figure class="ic"><div class="app a1">__ICON_A__</div><figcaption>Pravi Punkt</figcaption></figure>
      <figure class="ic"><div class="app a2">__ICON_B__</div><figcaption>Pravi Punkt</figcaption></figure>
    </div>
    <label class="szl">Velikost <input type="range" id="isize" min="16" max="260" value="260" aria-label="Velikost ikone"><output id="ipx">260 px</output></label>
  </div>
</section>

<!-- različice -->
<section id="razlicice" class="osn tp4">
  <div class="isec">
    <div class="tag"><b>Različice</b></div>
    <div class="plate2" id="plate2" data-m="light">
      <div class="disc"><div class="lk">__LK__</div></div>
    </div>
    <div class="seg" id="vseg"><button class="on" data-m="light">Belo</button><button data-m="dark">Črno</button><button data-m="teal">Turkizno</button><button data-m="disc">Krog</button></div>
  </div>
</section>
</main>

<script>__TLJS__</script>
<script>__SCENJS__</script>
<script>__PAGEJS__</script>
</body>
</html>
