      <rect y="7" width="275" height="275" rx="66.49" fill="#005f66"/>
      <rect width="275" height="275" rx="66.49" fill="url(#tFace)"/>
      <rect x="1" y="1" width="273" height="273" rx="65.5" fill="none" stroke="url(#rim)" stroke-width="2"/>
