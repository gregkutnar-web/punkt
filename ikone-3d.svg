<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 780">
  <defs>
    <!-- Teal: ploskev, rob, sijaj -->
    <linearGradient id="tFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14a3ad"/>
      <stop offset=".55" stop-color="#00868f"/>
      <stop offset="1" stop-color="#006d75"/>
    </linearGradient>
    <linearGradient id="tSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#005f66"/>
      <stop offset="1" stop-color="#004349"/>
    </linearGradient>
    <!-- Bela -->
    <linearGradient id="wFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3f3f4"/>
    </linearGradient>
    <linearGradient id="wSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d6d9"/>
      <stop offset="1" stop-color="#7bbcc1"/>
    </linearGradient>
    <!-- Rob in sijaj -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".22"/>
      <stop offset=".4" stop-color="#000" stop-opacity="0"/>
    </linearGradient>

    <filter id="shBig" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="shSmall" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="embossW" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#00343a" flood-opacity=".5"/>
    </filter>
    <filter id="embossT" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#00868f" flood-opacity=".4"/>
    </filter>
    <filter id="embossTp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#00868f" flood-opacity=".4"/>
    </filter>
    <filter id="embossWp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#00343a" flood-opacity=".5"/>
    </filter>

    <!-- Ikona (voziček s piko), lokalne koordinate ploščice 275 × 275 -->
    <g id="icon">
      <path transform="translate(0,-30.45)" d="M82.95,235.35c-11.28,0-19.77-3.01-25.22-8.93-5.17-5.62-7.8-14.01-7.83-24.96l12.73-99.96v-.16c0-.63.1-.73.73-.73h24.94c.26,0,.4.04.44.06,0,0,.07.16.08.53l-12.73,97.75v.16c0,9.44,4.46,13.84,14.04,13.84h94.78c9.58,0,14.04-4.4,14.04-13.84v-.16l-12.68-97.75c.02-.5.14-.58.73-.58h24.74c.63,0,.73.1.73.73v.16l12.68,99.96c-.02,9.98-2.23,17.86-6.55,23.41-4.5,5.77-11.46,9.19-20.71,10.16-2.14.22-3.98.33-5.79.33h-109.14Z"/>
      <path transform="translate(0,-30.45)" d="M137.53,179.45c-12.51,0-22.68-10.17-22.68-22.68s10.17-22.68,22.68-22.68,22.68,10.17,22.68,22.68-10.17,22.68-22.68,22.68Z"/>
    </g>

    <!-- Dvignjen gumb (d = globina ekstruzije) -->
    <g id="btnTeal">
      <rect x="10" y="40" width="255" height="275" rx="66.49" fill="#00343a" opacity=".55" filter="url(#shBig)"/>
      <rect y="24" width="275" height="275" rx="66.49" fill="url(#tSide)"/>
      <rect width="275" height="275" rx="66.49" fill="url(#tFace)"/>
      <rect x="1.5" y="1.5" width="272" height="272" rx="65" fill="none" stroke="url(#rim)" stroke-width="3"/>
      <rect x="6" y="6" width="263" height="150" rx="60" fill="url(#gloss)"/>
      <use xlink:href="#icon" fill="#fff" filter="url(#embossW)"/>
    </g>
    <g id="btnWhite">
      <rect x="10" y="40" width="255" height="275" rx="66.49" fill="#00868f" opacity=".4" filter="url(#shBig)"/>
      <rect y="24" width="275" height="275" rx="66.49" fill="url(#wSide)"/>
      <rect width="275" height="275" rx="66.49" fill="url(#wFace)"/>
      <rect x="1.5" y="1.5" width="272" height="272" rx="65" fill="none" stroke="#00868f" stroke-opacity=".18" stroke-width="3"/>
      <rect x="6" y="6" width="263" height="150" rx="60" fill="url(#gloss)"/>
      <use xlink:href="#icon" fill="#00868f" filter="url(#embossT)"/>
    </g>

    <!-- Pritisnjen gumb -->
    <g id="btnTealP">
      <rect x="14" y="14" width="247" height="275" rx="66.49" fill="#00343a" opacity=".5" filter="url(#shSmall)"/>
      <rect y="8" width="275" height="275" rx="66.49" fill="url(#tSide)"/>
      <g transform="translate(0,16)">
        <rect width="275" height="275" rx="66.49" fill="url(#tFace)"/>
        <rect width="275" height="275" rx="66.49" fill="url(#dent)"/>
        <rect x="1.5" y="1.5" width="272" height="272" rx="65" fill="none" stroke="url(#rim)" stroke-width="3" opacity=".6"/>
        <use xlink:href="#icon" fill="#fff" filter="url(#embossWp)"/>
      </g>
    </g>
    <g id="btnWhiteP">
      <rect x="14" y="14" width="247" height="275" rx="66.49" fill="#00868f" opacity=".35" filter="url(#shSmall)"/>
      <rect y="8" width="275" height="275" rx="66.49" fill="url(#wSide)"/>
      <g transform="translate(0,16)">
        <rect width="275" height="275" rx="66.49" fill="url(#wFace)"/>
        <rect width="275" height="275" rx="66.49" fill="#00868f" opacity=".08"/>
        <rect x="1.5" y="1.5" width="272" height="272" rx="65" fill="none" stroke="#00868f" stroke-opacity=".2" stroke-width="3"/>
        <use xlink:href="#icon" fill="#00868f" filter="url(#embossTp)"/>
      </g>
    </g>
  </defs>

  <!-- Dvignjena -->
  <use xlink:href="#btnTeal" x="50" y="30"/>
  <use xlink:href="#btnWhite" x="395" y="30"/>
  <!-- Pritisnjena -->
  <use xlink:href="#btnTealP" x="50" y="430"/>
  <use xlink:href="#btnWhiteP" x="395" y="430"/>
</svg>
