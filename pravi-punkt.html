<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pravi Punkt – izbrani logotip</title>
<meta name="description" content="Izbrani logotip Pravi Punkt, Skupina Boscarol.">
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--sans:"Helvetica Neue","Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;--dark:#0b0e0f;--ease:cubic-bezier(.2,.8,.2,1)}
html{scroll-behavior:auto;background:var(--dark)}
body{font-family:var(--sans);color:#eef1f0;background:var(--dark);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
section{position:relative}

/* barve logotipov v primerjavi/končnem osnutku */
.pl0{fill:#ff6b4a}.pl1{fill:var(--t1,#25525f)}.pl2{fill:var(--t2,#666)}.pl3{fill:#00b1bc}.pl4{fill:#e7a83e}
.dk{--t1:#e4edef;--t2:#f2f2f0}

/* ---- lebdeča navigacija ---- */
#nav{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;z-index:50;display:flex;gap:2px;padding:6px;border-radius:999px;background:rgba(18,22,24,.62);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 14px 50px rgba(0,0,0,.35);transition:opacity .7s var(--ease),transform .7s var(--ease);max-width:calc(100vw - 20px)}
#nav.on{opacity:1;transform:translate(-50%,0)}
#nav a{position:relative;z-index:1;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;letter-spacing:.01em;color:rgba(238,241,240,.72);text-decoration:none;white-space:nowrap;transition:color .3s}
#nav a:hover{color:#fff}
#nav a.cur{color:#0b0e0f}
#nav .pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;background:#f2f2f0;transition:left .45s var(--ease),width .45s var(--ease),opacity .3s;opacity:0}
#nav .pill.on{opacity:1}
#nav a .s{display:none}

/* ---- hero (nevtralen, brez logotipov) ---- */
#hero{height:100vh;min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(120% 90% at 50% 30%,#171c1e 0%,#0b0e0f 70%);overflow:hidden}
#hero h1{font-size:clamp(64px,17vw,250px);font-weight:800;letter-spacing:.05em;line-height:1;margin-left:.05em;color:#f2f2f0}
#hero h1 span{display:inline-block;opacity:0;transform:translateY(40px);animation:rise 1.1s var(--ease) forwards}
#hero h1 span:nth-child(2){animation-delay:.08s}#hero h1 span:nth-child(3){animation-delay:.16s}#hero h1 span:nth-child(4){animation-delay:.24s}#hero h1 span:nth-child(5){animation-delay:.32s}
@keyframes rise{to{opacity:1;transform:none}}
#hero p{margin-top:3vh;font-size:clamp(13px,1.5vw,20px);letter-spacing:.42em;text-transform:uppercase;color:#8d9896;opacity:0;animation:rise 1s .7s var(--ease) forwards}
#hero .bg{position:absolute;left:0;right:0;bottom:calc(18px + 74px);display:flex;justify-content:center}
#hero .cue{width:1px;height:64px;background:linear-gradient(#f2f2f0,transparent);transform-origin:top;animation:cue 2.2s 1.4s ease-in-out infinite;opacity:.8}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
#hero .by{position:absolute;left:5vw;top:5vh;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#6c7775}

/* ---- osnutki ---- */
.osn{--bg:#f2f2f2;--ink:#1d2224;--mute:#7b8483;--acc:#ff6b4a;--card:#fff;--line:rgba(0,0,0,.1);background:var(--bg);color:var(--ink)}
.osn.t2{--bg:#0d2831;--ink:#eaf1f2;--mute:#86a2a9;--acc:#e7a83e;--card:#133540;--line:rgba(255,255,255,.14)}
.osn.t3{--bg:#e8eaeb;--ink:#1d2224;--mute:#7b8483;--acc:#00b1bc;--card:#fff;--line:rgba(0,0,0,.1)}
.scrub{height:calc(var(--n) * 58vh + 100vh);position:relative}
.sticky{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:9vh 4vw 13vh;overflow:hidden}
.tag{position:absolute;left:4vw;top:4.5vh;font-size:13px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
.tag b{color:var(--ink)}
.stage{width:min(92vw,calc(60vh * 16 / 9));aspect-ratio:16/9;border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.14),0 0 0 1px var(--line);background:#f2f2f2;display:block}
.t2 .stage{box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px var(--line)}
.film{display:flex;gap:6px;width:min(92vw,calc(60vh * 16 / 9));overflow-x:auto;scrollbar-width:none;padding:3px}
.film::-webkit-scrollbar{display:none}
.th{flex:1 0 54px;min-width:54px;aspect-ratio:1/1;border-radius:9px;overflow:hidden;opacity:.5;border:2px solid transparent;transition:opacity .25s,border-color .25s,transform .25s;background:#f2f2f2}
.th svg{display:block;width:100%;height:100%}
.th:hover{opacity:1}.th.on{opacity:1;border-color:var(--acc);transform:translateY(-3px)}
.ctl{display:flex;align-items:center;gap:18px;width:min(92vw,calc(60vh * 16 / 9));justify-content:space-between}
.play{height:44px;padding:0 24px;border-radius:22px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;letter-spacing:.05em}
.play:hover{filter:brightness(1.15)}
.bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc)}
.cnt{font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--mute);font-variant-numeric:tabular-nums;min-width:62px;text-align:right}

/* končni osnutek */
.final{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;padding:9vh 4vw 14vh;position:relative}
.plate{width:min(92vw,calc(66vh * 16 / 9));aspect-ratio:16/9;border-radius:30px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;transition:background .5s,transform 1s var(--ease),opacity 1s var(--ease);opacity:0;transform:scale(.94);box-shadow:0 40px 100px rgba(0,0,0,.18)}
.plate.dk{background:#1b2123}
.t2 .plate.dk{background:#0a1c22}
.final.in .plate{opacity:1;transform:none}
.plate svg{width:64%;height:auto;max-height:70%}
.seg{display:inline-flex;border-radius:999px;border:1px solid var(--line);padding:4px;background:var(--card)}
.seg button{padding:9px 20px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--mute);transition:all .25s}
.seg button.on{background:var(--ink);color:var(--bg)}

/* mockup (približek) */
.mock{height:240vh;position:relative}
.mock .sticky{padding:0;gap:0;justify-content:flex-start}
.mock .view{position:absolute;inset:0;overflow:hidden;background:#111}
.mock img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.mock .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 28%,transparent 70%,rgba(0,0,0,.45));pointer-events:none}
.mock .cap{position:absolute;left:4vw;bottom:calc(18px + 74px);font-size:13px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.mock .tag{color:rgba(255,255,255,.8);z-index:2}.mock .tag b{color:#fff}

/* osnutek 3: 2D animacija */
.s3{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;min-height:100vh;padding:9vh 4vw 14vh;position:relative}
.s3 .tag{position:absolute}
.s3 .stage{cursor:pointer}

/* primerjava mockupov */
#pm{background:var(--dark);padding:12vh 0 15vh;min-height:100vh}
.head{padding:0 4vw 5vh;font-size:13px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#8d9896}
.acc{display:flex;gap:10px;height:72vh;padding:0 4vw}
.acc .p{position:relative;flex:1;border-radius:22px;overflow:hidden;cursor:pointer;transition:flex .8s var(--ease);background:#111}
.acc.has .p{flex:.55}.acc.has .p.on{flex:4}
.acc .p img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease),filter .6s}
.acc .p.on img{transform:scale(1.06)}
.acc.has .p:not(.on) img{filter:brightness(.55) saturate(.85)}
.acc .p .n{position:absolute;left:22px;bottom:20px;font-size:13px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.6);white-space:nowrap}
.acc .p::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.5))}

/* primerjava logotipov */
#pl{background:#f2f2f2;color:#1d2224;padding:12vh 0 17vh;min-height:100vh;--line:rgba(0,0,0,.1)}
#pl .head{color:#7b8483}
.pctl{position:sticky;top:14px;z-index:20;margin:0 auto 3vh;width:max-content;max-width:94vw;display:flex;gap:14px 22px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px 18px;border-radius:26px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.08)}
.pctl label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7b8483;display:flex;align-items:center;gap:10px}
.pctl input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:4px;border-radius:2px;background:rgba(0,0,0,.15);outline:none}
.pctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#1d2224;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.3);cursor:pointer}
.pctl input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#1d2224;border:3px solid #fff;cursor:pointer}
.pctl .seg{background:#fff}
.lg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 4vw}
.lc{height:min(60vh,520px);border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .5s;position:relative;box-shadow:0 0 0 1px var(--line)}
.lc svg{width:calc(var(--w,100) * .86%);height:auto;transition:filter .2s;max-height:60%}
.lc .k{position:absolute;left:20px;top:16px;font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#9aa3a2}
#pl.dark .lc{background:#1b2123}#pl.dark .lc .k{color:#5d6a69}
#pl.mono .lc svg{filter:grayscale(1)}
#pl.mono.dark .lc svg{filter:grayscale(1)}
#pl{transition:background .5s}
#pl.dark{background:#0f1314;color:#eef1f0}#pl.dark .head{color:#6d7a79}
#pl.dark .pctl{background:rgba(24,28,30,.82);border-color:rgba(255,255,255,.12)}#pl.dark .pctl label{color:#9aa5a3}#pl.dark .pctl .seg{background:#1b2123;border-color:rgba(255,255,255,.12)}
#pl.dark .pctl input[type=range]{background:rgba(255,255,255,.2)}
#pl.dark .pctl input[type=range]::-webkit-slider-thumb{background:#f2f2f0;border-color:#1b2123}
#pl.dark .seg button.on{background:#f2f2f0;color:#0b0e0f}

@media (max-width:820px){
  #nav a{padding:10px 11px;font-size:13px}#nav a .l{display:none}#nav a .s{display:inline}
  .lg{grid-template-columns:1fr}.lc{height:34vh}.lc svg{width:calc(var(--w,100) * .72%)}
  .acc{flex-direction:column;height:auto}.acc .p{flex:none;height:26vh;transition:height .8s var(--ease)}.acc.has .p{flex:none;height:14vh}.acc.has .p.on{height:42vh}
  .stage,.film,.ctl{width:94vw}.stage{border-radius:16px}
  .pctl input[type=range]{width:110px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ---- Pravi Punkt: nad landing.css ---- */
:root{--teal:#00868f}
#hero h1{font-size:clamp(54px,12.5vw,190px);letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;line-height:.95;margin-left:0;text-transform:uppercase}
#hero h1 span{opacity:0;transform:translateY(40px);animation:rise 1.1s var(--ease) forwards}
#hero h1 .w2{animation-delay:.12s}
#hero h1 span:nth-child(n){display:block}

.osn.tp1{--bg:#f2f2f2;--ink:#1d2224;--mute:#7b8483;--acc:#00868f;--card:#fff;--line:rgba(0,0,0,.1)}
.osn.tp2{--bg:#fff;--ink:#101415;--mute:#7b8483;--acc:#00868f;--card:#f2f2f2;--line:rgba(0,0,0,.1)}
.osn.tp3{--bg:#dcecee;--ink:#0b3a3f;--mute:#4f7478;--acc:#00868f;--card:#fff;--line:rgba(0,0,0,.12)}
.osn.tp4{--bg:#0d1112;--ink:#eef1f0;--mute:#8d9896;--acc:#00868f;--card:#1a2022;--line:rgba(255,255,255,.14)}

.stagewrap{position:relative;width:min(92vw,calc(60vh * 16 / 9))}
.stagewrap .stage{width:100%}
.stagewrap .cap{position:absolute;left:26px;bottom:22px;font-size:clamp(18px,2.4vw,34px);font-weight:800;letter-spacing:.02em;color:#101415;pointer-events:none}
.stagewrap .cap span{display:inline-block;transition:opacity .25s,transform .35s var(--ease)}
.stagewrap .cap span.sw{opacity:0;transform:translateY(8px)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips button{padding:9px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--mute);transition:all .25s}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button:hover{color:var(--ink)}

.isec{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh;padding:9vh 4vw 14vh;position:relative}
.icons{display:flex;gap:min(6vw,70px);flex-wrap:wrap;justify-content:center;align-items:flex-start}
.ic{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,calc(var(--sz) * .08),22px);transition:gap .2s}
.ic figcaption{font-size:clamp(11px,calc(var(--sz) * .1),24px);font-weight:600;color:var(--mute);white-space:nowrap}
.app{width:var(--sz);height:var(--sz);border-radius:22.5%;display:flex;align-items:center;justify-content:center;transition:transform .35s var(--ease)}
.app svg{width:100%;height:100%;display:block;overflow:visible}
.app{position:relative;overflow:hidden}
.app::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%,rgba(0,0,0,.10));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 calc(var(--sz) * .012) calc(var(--sz) * .02) rgba(255,255,255,.35)}
.app.a1{background:var(--teal);box-shadow:0 calc(var(--sz) * .05) calc(var(--sz) * .12) rgba(0,0,0,.28)}
.app.a2{background:linear-gradient(180deg,#fff,#eef1f2);box-shadow:0 calc(var(--sz) * .05) calc(var(--sz) * .12) rgba(0,0,0,.25)}
.app.a2::after{background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0) 45%,rgba(0,0,0,.05))}
#ikona .isec{background:radial-gradient(circle at 20% 25%,#c9a58c,transparent 55%),radial-gradient(circle at 80% 70%,#8fb0a8,transparent 55%),linear-gradient(160deg,#a9785f,#7f8f78);border-radius:0}
#ikona .ic figcaption{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35)}
#ikona .szl,#ikona .szl output,#ikona .tag,#ikona .tag b{color:#fff}
.app:hover{transform:translateY(-6px) scale(1.03)}
.app .dt{transform-box:fill-box;transform-origin:50% 100%}
.app:hover .dt{animation:hop .7s var(--ease)}
@keyframes hop{0%{transform:none}35%{transform:translateY(-16%) scale(.95,1.08)}70%{transform:translateY(0) scale(1.15,.85)}100%{transform:none}}
.szl{display:flex;align-items:center;gap:16px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.szl input{-webkit-appearance:none;appearance:none;width:min(46vw,320px);height:4px;border-radius:2px;background:rgba(0,0,0,.18);outline:none}
.szl input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--ink);border:4px solid var(--bg);cursor:pointer}
.szl input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:4px solid var(--bg);cursor:pointer}
.szl output{min-width:62px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}

/* različice: preobrazba ozadja */
.plate2{--bg2:#fff;--tx:#000;--ac:#00868f;position:relative;width:min(92vw,calc(64vh * 16 / 9));aspect-ratio:16/9;border-radius:30px;background:#0d1112;transition:background .6s}
.plate2[data-m=disc]{background:#f2f2f2}
.disc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:100%;border-radius:30px;background:var(--bg2);display:flex;align-items:center;justify-content:center;transition:width .8s var(--ease),height .8s var(--ease),border-radius .8s var(--ease),background .6s,box-shadow .8s}
.plate2[data-m=disc] .disc{width:calc(56.25% * .9);height:90%;border-radius:50%;box-shadow:0 30px 60px rgba(0,0,0,.18)}
.plate2[data-m=dark]{--bg2:#000;--tx:#fff;--ac:#00868f}
.plate2[data-m=teal]{--bg2:#00868f;--tx:#fff;--ac:#000}
.plate2[data-m=light],.plate2[data-m=disc]{--bg2:#fff;--tx:#000;--ac:#00868f}
.lk{width:62%;transition:width .8s var(--ease)}
.plate2[data-m=disc] .lk{width:80%}
.lk svg{width:100%;height:auto;display:block}
.lk .tx{fill:var(--tx);transition:fill .6s}.lk .ac{fill:var(--ac);transition:fill .6s}
.tp4 .seg{background:var(--card)}

@media (max-width:820px){.isec{padding-bottom:130px}.icons{flex-direction:row;gap:24px}.stagewrap,.stagewrap .stage{width:94vw}.stagewrap .cap{left:14px;bottom:12px}.plate2{border-radius:18px}.disc{border-radius:18px}}

/* nastanek: predvajalnik */
.cinesec{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:9vh 4vw 13vh;position:relative}
.cinesec .tag{position:absolute}
.stagewrap .cap span{transition:opacity .25s,transform .35s var(--ease),color .4s}
.player{display:flex;align-items:center;gap:16px;width:min(92vw,calc(60vh * 16 / 9))}
.player .play{height:44px;min-width:112px;padding:0 20px;border-radius:22px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;letter-spacing:.05em}
.seek{position:relative;flex:1;height:26px;cursor:pointer;touch-action:none}
.seek::before{content:"";position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:var(--line)}
.seek i{position:absolute;left:0;top:11px;height:4px;border-radius:2px;background:var(--acc);width:0}
.seek b{position:absolute;top:5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--ink);left:0;box-shadow:0 0 0 4px var(--bg)}
.seek .tkm{position:absolute;top:8px;width:2px;height:10px;margin-left:-1px;background:rgba(0,0,0,.25);border-radius:1px}
.player .tm{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--mute);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.player .spd{height:36px;min-width:46px;padding:0 12px;border-radius:18px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mute)}
.player .spd:hover{color:var(--ink)}
.plate2 .hl{fill:var(--ac);opacity:0;transition:opacity .5s}
.plate2[data-h="1"] .hl{opacity:.4}

.stagewrap .cap span.pop{animation:capin .45s var(--ease)}
@keyframes capin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<nav id="nav" aria-label="Navigacija">
  <span class="pill"></span>
  <a href="#nastanek"><span class="l">Nastanek</span><span class="s">Nastanek</span></a>
  <a href="#logotip"><span class="l">Logotip</span><span class="s">Logotip</span></a>
  <a href="#ikona"><span class="l">Ikona</span><span class="s">Ikona</span></a>
  <a href="#razlicice"><span class="l">Različice</span><span class="s">Različice</span></a>
</nav>

<main>
<!-- hero: nevtralen, brez ikone in logotipa -->
<section id="hero">
  <div class="by">Skupina Boscarol</div>
  <h1 aria-label="Pravi Punkt"><span class="w1">Pravi</span><span class="w2">Punkt</span></h1>
  <p>Izbrani logotip</p>
  <div class="bg"><div class="cue"></div></div>
